
name: Build EmberFlow APKs

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Find and extract existing source ZIP
        shell: bash
        run: |
          set -euo pipefail

          if { [ -f settings.gradle ] || [ -f settings.gradle.kts ]; } && \
             { [ -f app/build.gradle ] || [ -f app/build.gradle.kts ]; }; then
            PROJECT_DIR="."
          else
            PROJECT_DIR=""
            mkdir -p .zip-check

            while IFS= read -r ZIP_FILE; do
              rm -rf .zip-check
              mkdir -p .zip-check
              unzip -q "$ZIP_FILE" -d .zip-check || continue

              while IFS= read -r SETTINGS; do
                ROOT="$(dirname "$SETTINGS")"

                if { [ -f "$ROOT/app/build.gradle" ] || \
                     [ -f "$ROOT/app/build.gradle.kts" ]; } && \
                   [ -f "$ROOT/app/src/main/java/com/emberflow/launcher/MainActivity.java" ]; then
                  PROJECT_DIR="$ROOT"
                  break
                fi
              done < <(
                find .zip-check -type f \
                  \( -name settings.gradle -o -name settings.gradle.kts \)
              )

              if [ -n "$PROJECT_DIR" ]; then
                SELECTED_ZIP="$ZIP_FILE"
                break
              fi
            done < <(
              find . -maxdepth 3 -type f -iname '*.zip' \
                ! -path './.git/*' ! -path './extracted/*' | sort
            )

            if [ -z "$PROJECT_DIR" ]; then
              echo "::error::No EmberFlow source ZIP found. Keep the existing ZIP in the repository."
              exit 1
            fi

            echo "Using source ZIP: $SELECTED_ZIP"
            rm -rf extracted
            mkdir -p extracted
            unzip -q "$SELECTED_ZIP" -d extracted

            SETTINGS="$(find extracted -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit)"

            if [ -z "$SETTINGS" ]; then
              echo "::error::Gradle settings file missing after extraction."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS")"
          fi

          PROJECT_ABS="$(realpath "$PROJECT_DIR")"
          PROJECT_REL="${PROJECT_ABS#$GITHUB_WORKSPACE/}"

          if [ "$PROJECT_ABS" = "$GITHUB_WORKSPACE" ]; then
            PROJECT_REL="."
          fi

          echo "PROJECT_ABS=$PROJECT_ABS" >> "$GITHUB_ENV"
          echo "PROJECT_REL=$PROJECT_REL" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_ABS"

      - name: Fix BuildConfig automatically
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$PROJECT_ABS/app/build.gradle" \
            "$PROJECT_ABS/app/build.gradle.kts" <<'PY'
          from pathlib import Path
          import re
          import sys

          candidates = [Path(sys.argv[1]), Path(sys.argv[2])]
          gradle_file = next((p for p in candidates if p.is_file()), None)

          if gradle_file is None:
              raise SystemExit("::error::App Gradle file not found.")

          source = gradle_file.read_text()
          kotlin = gradle_file.name.endswith(".kts")
          setting = "buildConfig = true" if kotlin else "buildConfig true"

          match = re.search(r"buildFeatures\s*\{([^}]*)\}", source, re.S)

          if match and re.search(
              r"\bbuildConfig\s*(?:=\s*)?true\b", match.group(1)
          ):
              print("BuildConfig is already enabled.")
          elif match:
              pos = match.start(1)
              source = source[:pos] + "\n        " + setting + source[pos:]
              gradle_file.write_text(source)
              print("Enabled BuildConfig inside buildFeatures.")
          else:
              android = re.search(r"\bandroid\s*\{", source)

              if not android:
                  raise SystemExit("::error::Android Gradle block not found.")

              pos = android.end()
              addition = (
                  "\n    buildFeatures {\n"
                  f"        {setting}\n"
                  "    }\n"
              )
              source = source[:pos] + addition + source[pos:]
              gradle_file.write_text(source)
              print("Added BuildConfig configuration.")
          PY

      - name: Check preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -f "$SDK/platforms/android-35/android.jar" ]; then
            echo "::error::Android SDK platform 35 is unavailable."
            ls -la "$SDK/platforms" || true
            exit 1
          fi

          if [ ! -d "$SDK/build-tools" ]; then
            echo "::error::Android build-tools are unavailable."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "Using preinstalled SDK: $SDK"
          ls "$SDK/build-tools"

      - name: Build all three APKs
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ABS"

          gradle --no-daemon \
            assembleLiteDebug \
            assembleNormalDebug \
            assembleProDebug

      - name: Upload Lite APK
        uses: actions/upload-artifact@v6
        with:
          name: EmberFlow-Lite-APK
          path: '**/app/build/outputs/apk/lite/debug/*.apk'
          if-no-files-found: error
          retention-days: 30

      - name: Upload Normal APK
        uses: actions/upload-artifact@v6
        with:
          name: EmberFlow-Normal-APK
          path: '**/app/build/outputs/apk/normal/debug/*.apk'
          if-no-files-found: error
          retention-days: 30

      - name: Upload Pro APK
        uses: actions/upload-artifact@v6
        with:
          name: EmberFlow-Pro-APK
          path: '**/app/build/outputs/apk/pro/debug/*.apk'
          if-no-files-found: error
          retention-days: 30
          
