
name: Build EmberFlow APKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify project files
        shell: bash
        run: |
          echo "Repository root:"
          ls -la
          echo "Searching for Gradle settings:"
          find . -maxdepth 4 \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) -print

      - name: Build APKs
        shell: bash
        run: |
          if [ -f "EmberFlow-Android/settings.gradle" ] || \
             [ -f "EmberFlow-Android/settings.gradle.kts" ]; then
            cd EmberFlow-Android
          elif [ -f "settings.gradle" ] || \
               [ -f "settings.gradle.kts" ]; then
            echo "Using repository root."
          else
            echo "::error::No Gradle project found. Check the repository files above."
            exit 1
          fi

          gradle --no-daemon assembleDebug

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EmberFlow-debug-apks
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
          
