name: Build EmberFlow APKs

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find and extract EmberFlow source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' ! -path './.git/*' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo '::error::No source ZIP found in the repository.'
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          if [ ! -f extracted/settings.gradle ] && [ ! -f extracted/settings.gradle.kts ]; then
            SETTINGS_FILE="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
            if [ -z "$SETTINGS_FILE" ]; then
              echo '::error::No Gradle settings file found inside the source ZIP.'
              find extracted -maxdepth 4 -type f | head -100
              exit 1
            fi
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          else
            PROJECT_DIR="extracted"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using Gradle project at: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Lite, Normal and Pro APKs
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleLiteDebug assembleNormalDebug assembleProDebug

      - name: Upload Lite APK
        uses: actions/upload-artifact@v4
        with:
          name: EmberFlow-Lite-APK
          path: extracted/**/build/outputs/apk/lite/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Normal APK
        uses: actions/upload-artifact@v4
        with:
          name: EmberFlow-Normal-APK
          path: extracted/**/build/outputs/apk/normal/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Pro APK
        uses: actions/upload-artifact@v4
        with:
          name: EmberFlow-Pro-APK
          path: extracted/**/build/outputs/apk/pro/debug/*.apk
          if-no-files-found: error
          retention-days: 30
